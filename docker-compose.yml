# Dev stack. node = Next dev server; build = one-off static export into ./out; nginx = optional preview of ./out.
# Ports are bound to 127.0.0.1 and come from .env. Every service lists its own environment; no env_file.
x-node: &node
  image: ${COMPOSE_PROJECT_NAME}-node:${NODE_VERSION}
  build:
    context: ./docker/node
    args:
      NODE_VERSION: ${NODE_VERSION}
  working_dir: /app
  volumes:
    - .:/app
    - root-node-modules:/app/node_modules

services:
  node:
    <<: *node
    container_name: ${COMPOSE_PROJECT_NAME}-node
    restart: unless-stopped
    command: ["sh", "/app/docker/node/dev.sh"]
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - PNPM_STORE_DIR=/app/node_modules/.pnpm-store
      - APP_DOMAIN=${APP_DOMAIN}
      - LITE_DEV_PORT=${LITE_DEV_PORT}
      - LOCALE_DEFAULT=${LOCALE_DEFAULT}
      - LOCALE_SUPPORTED=${LOCALE_SUPPORTED}
      - SITE_URL=${SITE_URL:-http://127.0.0.1:${LITE_PREVIEW_PORT}}
    ports:
      - "127.0.0.1:${LITE_DEV_PORT}:${LITE_DEV_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$LITE_DEV_PORT"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  # build: `docker compose run --rm build`. Output: ./out
  build:
    <<: *node
    container_name: ${COMPOSE_PROJECT_NAME}-build
    profiles: ["build"]
    command: ["sh", "/app/docker/node/build.sh"]
    environment:
      - NODE_ENV=production
      - STATIC_EXPORT=1
      - NEXT_TELEMETRY_DISABLED=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - PNPM_STORE_DIR=/app/node_modules/.pnpm-store
      - LOCALE_DEFAULT=${LOCALE_DEFAULT}
      - LOCALE_SUPPORTED=${LOCALE_SUPPORTED}
      - SITE_URL=${SITE_URL:-http://127.0.0.1:${LITE_PREVIEW_PORT}}

  # e2e / lighthouse: browser tests and Lighthouse against the preview (the nginx service must be up).
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    container_name: ${COMPOSE_PROJECT_NAME}-e2e
    profiles: ["e2e"]
    working_dir: /app
    environment:
      - E2E_PORTAL_ORIGIN=http://nginx
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules

  # preview: serves ./out (clean URLs, 404.html).
  nginx:
    image: ${COMPOSE_PROJECT_NAME}-nginx:${NGINX_VERSION}
    build:
      context: ./docker/nginx
      args:
        NGINX_VERSION: ${NGINX_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    profiles: ["preview"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITE_PREVIEW_PORT}:80"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./out:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  root-node-modules:
