# Dev stack: Next dev server (node) behind an nginx preview. Every service lists its own environment; no env_file.
services:
  node:
    image: node:${NODE_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-node
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/docker/node/dev.sh"]
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - PNPM_STORE_DIR=/app/node_modules/.pnpm-store
      - APP_DOMAIN=${APP_DOMAIN}
      - LITE_DEV_PORT=${LITE_DEV_PORT}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-}
      - LOCALE_DEFAULT=${LOCALE_DEFAULT}
      - LOCALE_SUPPORTED=${LOCALE_SUPPORTED}
      - PORTAL_REVALIDATE_SECRET=${PORTAL_REVALIDATE_SECRET:-}
      - SITE_URL=${SITE_URL:-http://${APP_DOMAIN}:${LITE_PREVIEW_PORT}}
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$LITE_DEV_PORT/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  # Browser tests (make e2e). Not started by `make up`; same code and node_modules as the node service.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    container_name: ${COMPOSE_PROJECT_NAME}-e2e
    profiles: ["e2e"]
    working_dir: /app
    environment:
      - E2E_PORTAL_ORIGIN=http://${APP_DOMAIN}:${LITE_PREVIEW_PORT}
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules

  nginx:
    image: nginx:${NGINX_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - LITE_DEV_PORT=${LITE_DEV_PORT}
    ports:
      - "${LITE_PREVIEW_PORT}:80"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - node

volumes:
  root-node-modules:
