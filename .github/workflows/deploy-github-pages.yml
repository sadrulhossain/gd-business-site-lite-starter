name: deploy-github-pages

# Publishes ./out to GitHub Pages on every push to main. Off until the repository variable DEPLOY_GITHUB_PAGES is 'true'.
# One-time: Settings > Pages > Source: GitHub Actions. Needs a custom domain or a user site (root-relative paths).
# Variables: SITE_URL (public origin, no trailing slash), LOCALE_DEFAULT, LOCALE_SUPPORTED. See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.DEPLOY_GITHUB_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LOCALE_DEFAULT: ${{ vars.LOCALE_DEFAULT || 'en' }}
      LOCALE_SUPPORTED: ${{ vars.LOCALE_SUPPORTED || 'en,bn' }}
      SITE_URL: ${{ vars.SITE_URL || 'http://127.0.0.1:28390' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Static export (validates the data first)
        run: STATIC_EXPORT=1 pnpm build
      - run: test -f out/index.html && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
