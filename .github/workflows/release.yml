name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOCALE_DEFAULT: en
      LOCALE_SUPPORTED: en,bn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: STATIC_EXPORT=1 pnpm build
      - name: Package ./out
        run: |
          test -f out/index.html
          (cd out && zip -qr "../site-${GITHUB_REF_NAME}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.ref_name }}
          path: site-${{ github.ref_name }}.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "site-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
