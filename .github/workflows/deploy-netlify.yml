name: deploy-netlify

# Publishes ./out to Netlify on every push to main. Off until the repository variable DEPLOY_NETLIFY is 'true'.
# Variables: SITE_URL, LOCALE_DEFAULT, LOCALE_SUPPORTED. Secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID. See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-netlify
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_NETLIFY == 'true'
    runs-on: ubuntu-latest
    env:
      LOCALE_DEFAULT: ${{ vars.LOCALE_DEFAULT || 'en' }}
      LOCALE_SUPPORTED: ${{ vars.LOCALE_SUPPORTED || 'en,bn' }}
      SITE_URL: ${{ vars.SITE_URL || 'http://127.0.0.1:28390' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Static export (validates the data first)
        run: STATIC_EXPORT=1 pnpm build
      - run: test -f out/index.html
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@22 deploy --dir=out --prod --no-build
