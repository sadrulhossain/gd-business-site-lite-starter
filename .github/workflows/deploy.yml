name: deploy

# One workflow, every push to main: build the static export once, then publish ./out to each configured target.
# A target that is not configured is not an error: its job still runs, prints a notice and passes (nothing is skipped or failed).
#
#   GitHub Pages     repository variable DEPLOY_GITHUB_PAGES=true, and Settings > Pages > Source: GitHub Actions
#   Cloudflare Pages secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variable CLOUDFLARE_PROJECT
#   Netlify          secrets NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
#
# Other variables: SITE_URL (public origin, no trailing slash), LOCALE_DEFAULT, LOCALE_SUPPORTED. See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LOCALE_DEFAULT: ${{ vars.LOCALE_DEFAULT || 'en' }}
      LOCALE_SUPPORTED: ${{ vars.LOCALE_SUPPORTED || 'en,bn' }}
      SITE_URL: ${{ vars.SITE_URL || 'http://127.0.0.1:28390' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Static export (validates the data first)
        run: STATIC_EXPORT=1 pnpm build
      - run: test -f out/index.html && touch out/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Not configured
        if: ${{ vars.DEPLOY_GITHUB_PAGES != 'true' }}
        run: echo "::notice::GitHub Pages is off (set the repository variable DEPLOY_GITHUB_PAGES to true to enable it)."
      - id: deployment
        if: ${{ vars.DEPLOY_GITHUB_PAGES == 'true' }}
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
    steps:
      - id: cfg
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare Pages is off (needs secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variable CLOUDFLARE_PROJECT)."
          fi
      - if: steps.cfg.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - if: steps.cfg.outputs.on == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - if: steps.cfg.outputs.on == 'true'
        run: npx --yes wrangler@4 pages deploy out --project-name="$CLOUDFLARE_PROJECT" --branch=main

  netlify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - id: cfg
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Netlify is off (needs secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID)."
          fi
      - if: steps.cfg.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - if: steps.cfg.outputs.on == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - if: steps.cfg.outputs.on == 'true'
        run: npx --yes netlify-cli@22 deploy --dir=out --prod --no-build
