name: deploy

# Builds the static export on every push to main and publishes ./out to each target that is switched on.
# A target is on when its repository variable is 'true' (Settings > Secrets and variables > Actions > Variables):
#   DEPLOY_GITHUB_PAGES, DEPLOY_CLOUDFLARE, DEPLOY_NETLIFY
# Other variables: SITE_URL (public origin, no trailing slash), LOCALE_DEFAULT, LOCALE_SUPPORTED (default en, bn).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (variable CLOUDFLARE_PROJECT), NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID.
# Details and one-time setup: docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOCALE_DEFAULT: ${{ vars.LOCALE_DEFAULT || 'en' }}
      LOCALE_SUPPORTED: ${{ vars.LOCALE_SUPPORTED || 'en,bn' }}
      SITE_URL: ${{ vars.SITE_URL || 'http://127.0.0.1:28390' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Static export (validates the data first)
        run: STATIC_EXPORT=1 pnpm build
      - run: test -f out/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          if-no-files-found: error

  github-pages:
    needs: build
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    needs: build
    if: vars.DEPLOY_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name="${{ vars.CLOUDFLARE_PROJECT }}" --branch=main --commit-dirty=true

  netlify:
    needs: build
    if: vars.DEPLOY_NETLIFY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@22 deploy --dir=out --prod --no-build
